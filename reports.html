<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Reports</title>

<link rel="stylesheet" href="css/reports.css">

</head>
<body>

<!-- Sidebar -->

<div class="sidebar">

    <h2 id="sidebarTitle">EMS</h2>

    <ul>

        <li><a href="dashboard.html">🏠 Dashboard</a></li>

        <li><a href="employees.html">👨 Employees</a></li>

        <li><a href="attendance.html">📅 Attendance</a></li>

        <li><a class="active" href="reports.html">📊 Reports</a></li>

        <li><a href="settings.html">⚙ Settings</a></li>

        <li><a href="index.html">🚪 Logout</a></li>

    </ul>

</div>

<!-- Main -->

<div class="main">

    <div class="header">

        <div>

            <h2 id="companyTitle">Employee Attendance System</h2>

            <h1>Attendance Reports</h1>

        </div>

    </div>

    <!-- Search -->

    <div class="top-bar">

    <input
        type="text"
        id="searchReport"
        placeholder="🔍 Search Employee..."
        onkeyup="searchReport()"
    >

    <button class="export-btn" onclick="downloadPDF()">
        📄 Export PDF
    </button>

</div>

    <!-- Summary Cards -->

    <div class="cards">

        <div class="card present">

            <h3>Present</h3>

            <h1 id="presentCount">0</h1>

        </div>

        <div class="card absent">

            <h3>Absent</h3>

            <h1 id="absentCount">0</h1>

        </div>

        <div class="card leave">

            <h3>Leave</h3>

            <h1 id="leaveCount">0</h1>

        </div>

    </div>

    <!-- Table -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Department</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="reportTable">

            </tbody>

        </table>

    </div>

</div>

<script>

let companyName = localStorage.getItem("companyName");

if(companyName){

document.getElementById("companyTitle").innerHTML = companyName;

document.getElementById("sidebarTitle").innerHTML = companyName;

}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<script src="js/reports.js"></script>
</body>
</html>
